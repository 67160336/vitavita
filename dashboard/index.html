<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VitaVita · ร้านวิตามินและอาหารเสริม</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500&family=Prompt:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f8f7; --card:#fff; --ink:#12231e; --muted:#5d6f68; --line:#dfe7e3;
  --brand:#1f8a70; --brand-ink:#fff; --soft:#e2f3ee; --danger:#c0392b; --shadow:0 1px 2px rgba(18,35,30,.06);
}
@media (prefers-color-scheme: dark){
  :root{--bg:#0f1614; --card:#172120; --ink:#e8f0ed; --muted:#97a9a2; --line:#27352f;
    --brand:#3cc9a4; --brand-ink:#08201a; --soft:#173a31; --danger:#ef7b6e; --shadow:none}
}
*{box-sizing:border-box}
html{scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 "Noto Sans Thai",system-ui,sans-serif;
  padding-top:env(safe-area-inset-top,0)}
h1,h2,h3,.num,button,.logo{font-family:Prompt,"Noto Sans Thai",sans-serif}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.wrap{max-width:1160px;margin:0 auto;padding:0 16px}

header{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:14px;height:62px}
.logo{font-weight:700;font-size:20px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.logo i{width:26px;height:14px;border-radius:99px;background:linear-gradient(90deg,var(--brand) 50%,#f59e0b 50%);transform:rotate(-35deg);display:block}
.search{flex:1;min-width:0}
.search input{width:100%;height:40px;border:1px solid var(--line);border-radius:10px;padding:0 14px;background:var(--bg);color:var(--ink);font:inherit}
.cartbtn{height:40px;padding:0 16px;border:0;border-radius:10px;background:var(--brand);color:var(--brand-ink);font-weight:600;white-space:nowrap}
.cartbtn b{display:inline-block;min-width:22px;margin-left:6px;padding:0 6px;border-radius:99px;background:var(--brand-ink);color:var(--brand);font-size:13px}

.hero{padding:34px 0 8px}
.hero h1{font-size:clamp(26px,5vw,42px);line-height:1.2;margin:0 0 8px;max-width:18em}
.hero p{margin:0;color:var(--muted);max-width:34em}
.chips{display:flex;gap:8px;overflow-x:auto;padding:18px 0 14px;scrollbar-width:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:6px 16px;font-size:14px}
.chips button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;padding-bottom:40px}
.p{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.p .art{height:150px;display:grid;place-items:center}
.p .art svg{height:118px;width:auto}
.p.out .art{filter:grayscale(1);opacity:.55}
.p .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:2px;flex:1}
.p small{color:var(--muted);font-size:13px}
.p h3{margin:0;font-size:16px;font-weight:600;line-height:1.35}
.p .low{color:var(--danger);font-size:13px}
.p .row{margin-top:auto;padding-top:10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.price{font-family:Prompt,sans-serif;font-weight:600;font-size:19px}
.add{border:1px solid var(--brand);background:transparent;color:var(--brand);border-radius:9px;padding:6px 12px;font-weight:500;font-size:14px}
.add:hover{background:var(--brand);color:var(--brand-ink)}
.add:disabled{border-color:var(--line);color:var(--muted);background:transparent;cursor:not-allowed}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 0}
footer{border-top:1px solid var(--line);color:var(--muted);font-size:13px;padding:20px 0 40px;text-align:center}

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
aside{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--card);z-index:40;display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .25s;visibility:hidden;padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
aside.on{transform:none;visibility:visible}
@media (prefers-reduced-motion:reduce){aside,.scrim{transition:none}}
.dh{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
.dh h2{margin:0;font-size:18px}
.x{border:0;background:transparent;color:var(--ink);font-size:24px;line-height:1;padding:4px 8px}
.db{flex:1;overflow-y:auto;padding:6px 18px 18px}
.df{border-top:1px solid var(--line);padding:14px 18px}
.line{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.line .t{width:46px;height:46px;border-radius:10px;display:grid;place-items:center;flex:none}
.line .t svg{height:34px;width:auto}
.line .n{flex:1;min-width:0;font-size:14px;line-height:1.35}
.line .n span{color:var(--muted);display:block}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px}
.qty button{border:0;background:transparent;color:var(--ink);width:30px;height:30px;font-size:16px}
.qty output{min-width:22px;text-align:center;font-size:14px}
.sum{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);padding:2px 0}
.sum.tot{color:var(--ink);font-size:18px;font-family:Prompt,sans-serif;font-weight:600;padding-top:8px}
.btn{width:100%;height:46px;border:0;border-radius:11px;background:var(--brand);color:var(--brand-ink);font-weight:600;font-size:16px;margin-top:12px;display:flex;align-items:center;justify-content:center;text-decoration:none}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.link{border:0;background:none;color:var(--brand);padding:10px 0 0;font-size:14px}
label{display:block;font-size:14px;font-weight:500;margin-top:12px}
input.f,textarea.f,select.f{width:100%;margin-top:4px;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--bg);color:var(--ink);font:inherit}
textarea.f{min-height:76px;resize:vertical}
.err{color:var(--danger);font-size:14px;margin-top:10px;min-height:1em}
.ok{background:var(--soft);border-radius:12px;padding:14px;margin:12px 0;font-size:15px}
.ok b{font-family:Prompt,sans-serif}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="logo"><i></i>VitaVita</div>
    <div class="search"><input id="q" type="search" placeholder="ค้นหาสินค้า เช่น วิตามินซี" aria-label="ค้นหาสินค้า"></div>
    <button class="cartbtn" id="open">ตะกร้า<b id="count">0</b></button>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <h1>วิตามินและอาหารเสริม สั่งง่าย ส่งถึงบ้าน</h1>
    <p id="promo"></p>
  </section>
  <div class="chips" id="chips" role="group" aria-label="หมวดสินค้า"></div>
  <section class="grid" id="grid" aria-live="polite"></section>
</main>
<footer><div class="wrap">ผลิตภัณฑ์เสริมอาหาร ไม่ใช่ยา ไม่ได้มีไว้เพื่อวินิจฉัย บำบัด หรือป้องกันโรค · ข้อมูลสินค้าในหน้านี้เป็นตัวอย่าง</div></footer>

<div class="scrim" id="scrim"></div>
<aside id="drawer" role="dialog" aria-modal="true" aria-labelledby="dt">
  <div class="dh"><h2 id="dt">ตะกร้าสินค้า</h2><button class="x" id="close" aria-label="ปิด">×</button></div>
  <div class="db" id="db"></div>
  <div class="df" id="df"></div>
</aside>

<script>
// ===== ตั้งค่าร้าน: แก้ตรงนี้ได้เลย =====
const CONFIG = {
  shipFee: 50,          // ค่าจัดส่ง (บาท)
  freeOver: 1000,       // ซื้อครบเท่านี้ส่งฟรี
  lineOA: "",           // LINE Official Account เช่น "@vitavita" (ว่าง = เปิดหน้าเลือกแชทใน LINE)
  payNote: "โอนเข้าพร้อมเพย์/บัญชีของร้าน (ใส่เลขบัญชีที่นี่) แล้วส่งสลิปทาง LINE"
};
const COLORS = {"วิตามิน":"#f59e0b","แร่ธาตุ":"#3b82f6","น้ำมันปลา/ไขมันดี":"#0ea5a4","โปรตีน/ฟิตเนส":"#8b5cf6",
  "ระบบย่อยอาหาร":"#65a30d","ผิวพรรณ":"#ec4899","นอนหลับ/ผ่อนคลาย":"#6366f1"};
const P = [
  {id:1,name:"วิตามินซี 1000 มก.",cat:"วิตามิน",price:290,stock:48,low:10},
  {id:2,name:"วิตามินดี3 2000 IU",cat:"วิตามิน",price:350,stock:6,low:10},
  {id:3,name:"วิตามินบีรวม",cat:"วิตามิน",price:320,stock:22,low:10},
  {id:16,name:"มัลติวิตามิน สำหรับผู้ชาย",cat:"วิตามิน",price:480,stock:33,low:10},
  {id:4,name:"แมกนีเซียม กลีไซเนต",cat:"แร่ธาตุ",price:450,stock:4,low:8},
  {id:5,name:"ซิงค์ พิโคลิเนต",cat:"แร่ธาตุ",price:390,stock:31,low:8},
  {id:6,name:"แคลเซียม + วิตามินดี",cat:"แร่ธาตุ",price:420,stock:0,low:8},
  {id:7,name:"น้ำมันปลา โอเมก้า-3",cat:"น้ำมันปลา/ไขมันดี",price:590,stock:27,low:12},
  {id:8,name:"คริลล์ออยล์",cat:"น้ำมันปลา/ไขมันดี",price:890,stock:9,low:6},
  {id:9,name:"เวย์โปรตีน ช็อกโกแลต 2 ปอนด์",cat:"โปรตีน/ฟิตเนส",price:1490,stock:15,low:5},
  {id:10,name:"ครีเอทีน โมโนไฮเดรต",cat:"โปรตีน/ฟิตเนส",price:690,stock:3,low:5},
  {id:11,name:"BCAA รสส้ม",cat:"โปรตีน/ฟิตเนส",price:750,stock:18,low:6},
  {id:12,name:"โปรไบโอติก 30 พันล้าน CFU",cat:"ระบบย่อยอาหาร",price:680,stock:25,low:8},
  {id:13,name:"คอลลาเจนเปปไทด์",cat:"ผิวพรรณ",price:790,stock:7,low:8},
  {id:14,name:"เมลาโทนิน 3 มก.",cat:"นอนหลับ/ผ่อนคลาย",price:380,stock:40,low:10},
  {id:15,name:"แอชวากานดา สกัด",cat:"นอนหลับ/ผ่อนคลาย",price:520,stock:12,low:10},
];
const $ = (id) => document.getElementById(id);
const baht = (n) => "฿" + Math.round(n).toLocaleString("th-TH");
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const byId = (id) => P.find((p) => p.id === id);
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};

let cat = "ทั้งหมด", query = "", view = "cart", lastOrder = null;
let cart = store.get("vita_cart", {});
Object.keys(cart).forEach((k) => { const p = byId(+k); if (!p || !p.stock) delete cart[k]; else cart[k] = Math.min(cart[k], p.stock); });

function bottle(c) {
  return `<svg viewBox="0 0 80 100" aria-hidden="true"><rect x="25" y="4" width="30" height="15" rx="4" fill="${c}" opacity=".75"/>
  <rect x="16" y="17" width="48" height="79" rx="12" fill="${c}"/><rect x="16" y="46" width="48" height="30" fill="#fff" opacity=".92"/>
  <rect x="25" y="54" width="30" height="4" rx="2" fill="${c}"/><rect x="25" y="62" width="19" height="4" rx="2" fill="${c}" opacity=".5"/></svg>`;
}
const tint = (c) => c + "22";

// ===== รายการสินค้า =====
function renderChips() {
  const cats = ["ทั้งหมด", ...Object.keys(COLORS)];
  $("chips").innerHTML = cats.map((c) => `<button aria-pressed="${c === cat}" data-c="${esc(c)}">${esc(c)}</button>`).join("");
}
function renderGrid() {
  const list = P.filter((p) => (cat === "ทั้งหมด" || p.cat === cat) && p.name.toLowerCase().includes(query));
  $("grid").innerHTML = list.length ? list.map((p) => {
    const c = COLORS[p.cat], out = p.stock === 0, inCart = cart[p.id] || 0;
    return `<article class="p${out ? " out" : ""}">
      <div class="art" style="background:${tint(c)}">${bottle(c)}</div>
      <div class="body"><small>${esc(p.cat)}</small><h3>${esc(p.name)}</h3>
        ${!out && p.stock <= p.low ? `<span class="low">เหลือ ${p.stock} ชิ้น</span>` : ""}
        <div class="row"><span class="price">${baht(p.price)}</span>
          <button class="add" data-add="${p.id}" ${out || inCart >= p.stock ? "disabled" : ""}>${out ? "สินค้าหมด" : "ใส่ตะกร้า"}</button></div></div></article>`;
  }).join("") : `<p class="empty">ไม่พบสินค้าที่ค้นหา ลองใช้คำอื่น หรือเลือกหมวดทั้งหมด</p>`;
}

// ===== ตะกร้า =====
const lines = () => Object.keys(cart).map((k) => ({ p: byId(+k), q: cart[k] }));
const subtotal = () => lines().reduce((s, l) => s + l.p.price * l.q, 0);
const shipping = () => (subtotal() === 0 || subtotal() >= CONFIG.freeOver ? 0 : CONFIG.shipFee);
function save() { store.set("vita_cart", cart); $("count").textContent = lines().reduce((s, l) => s + l.q, 0); }
function add(id, d) {
  const p = byId(id), q = (cart[id] || 0) + d;
  if (q <= 0) delete cart[id]; else if (q <= p.stock) cart[id] = q;
  save(); renderGrid(); renderDrawer();
}

function summaryHTML() {
  const s = subtotal(), f = shipping();
  return `<div class="sum"><span>ค่าสินค้า</span><span>${baht(s)}</span></div>
    <div class="sum"><span>ค่าจัดส่ง</span><span>${f ? baht(f) : "ส่งฟรี"}</span></div>
    <div class="sum tot"><span>ยอดรวม</span><span>${baht(s + f)}</span></div>`;
}
function renderDrawer() {
  const db = $("db"), df = $("df");
  if (view === "cart") {
    $("dt").textContent = "ตะกร้าสินค้า";
    const L = lines();
    if (!L.length) {
      db.innerHTML = `<p class="empty">ตะกร้ายังว่าง เลือกสินค้าที่ต้องการได้เลย</p>`;
      df.innerHTML = `<button class="btn alt" data-act="close">เลือกซื้อสินค้า</button>`;
      return;
    }
    db.innerHTML = L.map(({ p, q }) => `<div class="line"><div class="t" style="background:${tint(COLORS[p.cat])}">${bottle(COLORS[p.cat])}</div>
      <div class="n">${esc(p.name)}<span>${baht(p.price)}</span></div>
      <div class="qty"><button data-dec="${p.id}" aria-label="ลดจำนวน">−</button><output>${q}</output><button data-inc="${p.id}" aria-label="เพิ่มจำนวน" ${q >= p.stock ? "disabled" : ""}>+</button></div></div>`).join("");
    const need = CONFIG.freeOver - subtotal();
    df.innerHTML = (need > 0 ? `<div class="sum">ซื้ออีก ${baht(need)} ส่งฟรี</div>` : "") + summaryHTML() +
      `<button class="btn" data-act="checkout">ไปชำระเงิน</button>`;
  } else if (view === "form") {
    $("dt").textContent = "ข้อมูลจัดส่ง";
    db.innerHTML = `<form id="form" novalidate>
      <label>ชื่อ-นามสกุล<input class="f" name="name" autocomplete="name" required></label>
      <label>เบอร์โทร<input class="f" name="phone" type="tel" inputmode="tel" autocomplete="tel" required></label>
      <label>ที่อยู่จัดส่ง<textarea class="f" name="address" autocomplete="street-address" required></textarea></label>
      <label>วิธีชำระเงิน<select class="f" name="pay"><option value="transfer">โอน / พร้อมเพย์</option><option value="cod">เก็บเงินปลายทาง</option></select></label>
      <div class="err" id="err" role="alert"></div></form>`;
    df.innerHTML = summaryHTML() + `<button class="btn" data-act="submit">ยืนยันสั่งซื้อ</button><button class="link" data-act="back">กลับไปตะกร้า</button>`;
  } else {
    const o = lastOrder;
    $("dt").textContent = "สั่งซื้อเรียบร้อย";
    db.innerHTML = `<div class="ok">เลขที่คำสั่งซื้อ <b>${esc(o.id)}</b><br>ยอดที่ต้องชำระ <b>${baht(o.total)}</b></div>
      <p>${o.pay === "cod" ? "ชำระเงินสดกับพนักงานส่งของเมื่อได้รับสินค้า" : esc(CONFIG.payNote)}</p>
      <p style="color:var(--muted);font-size:14px">กดปุ่มด้านล่างเพื่อส่งรายละเอียดคำสั่งซื้อให้ร้านทาง LINE ร้านจะได้ยืนยันและจัดส่งให้คุณ</p>`;
    const text = orderText(o), enc = encodeURIComponent(text);
    const href = CONFIG.lineOA ? `https://line.me/R/oaMessage/${encodeURIComponent(CONFIG.lineOA)}/?${enc}` : `https://line.me/R/msg/text/?${enc}`;
    df.innerHTML = `<a class="btn" href="${href}" target="_blank" rel="noopener">ส่งคำสั่งซื้อทาง LINE</a>
      <button class="btn alt" data-act="copy">คัดลอกรายละเอียด</button><button class="link" data-act="close">กลับไปเลือกซื้อสินค้า</button>`;
  }
}
function orderText(o) {
  return [`คำสั่งซื้อ ${o.id}`, ...o.items.map((i) => `- ${i.name} x${i.qty} = ${baht(i.qty * i.unitPrice)}`),
    `ค่าจัดส่ง: ${o.shipping ? baht(o.shipping) : "ส่งฟรี"}`, `ยอดรวม: ${baht(o.total)}`,
    `ชำระเงิน: ${o.pay === "cod" ? "เก็บเงินปลายทาง" : "โอน/พร้อมเพย์"}`,
    `ผู้รับ: ${o.customer} (${o.phone})`, `ที่อยู่: ${o.address}`].join("\n");
}
function submit() {
  const f = $("form"), v = (n) => f.elements[n].value.trim(), err = $("err");
  const phone = v("phone").replace(/[\s-]/g, "");
  if (!v("name")) return (err.textContent = "กรอกชื่อ-นามสกุลผู้รับ");
  if (!/^0\d{8,9}$/.test(phone)) return (err.textContent = "กรอกเบอร์โทรให้ถูกต้อง เช่น 0812345678");
  if (v("address").length < 10) return (err.textContent = "กรอกที่อยู่จัดส่งให้ครบ (บ้านเลขที่ ถนน ตำบล อำเภอ จังหวัด รหัสไปรษณีย์)");
  const items = lines().map(({ p, q }) => ({ productId: p.id, name: p.name, qty: q, unitPrice: p.price }));
  const ship = shipping();
  lastOrder = { id: "WEB-" + Date.now().toString(36).toUpperCase().slice(-6), ts: Date.now(), customer: v("name"), phone, address: v("address"),
    pay: v("pay"), items, shipping: ship, total: subtotal() + ship, status: "pending_payment" };
  store.set("vita_orders", [...store.get("vita_orders", []), lastOrder]);
  cart = {}; save(); view = "done"; renderGrid(); renderDrawer();
}

// ===== เปิด/ปิดตะกร้า + เหตุการณ์ =====
function openDrawer(v) { view = v || "cart"; renderDrawer(); $("drawer").classList.add("on"); $("scrim").classList.add("on"); $("close").focus(); }
function closeDrawer() { $("drawer").classList.remove("on"); $("scrim").classList.remove("on"); if (view === "done") view = "cart"; $("open").focus(); }
$("open").onclick = () => openDrawer("cart");
$("close").onclick = $("scrim").onclick = closeDrawer;
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeDrawer(); });
$("q").oninput = (e) => { query = e.target.value.trim().toLowerCase(); renderGrid(); };
$("chips").onclick = (e) => { const b = e.target.closest("button"); if (b) { cat = b.dataset.c; renderChips(); renderGrid(); } };
$("grid").onclick = (e) => { const b = e.target.closest("[data-add]"); if (b) { add(+b.dataset.add, 1); openDrawer("cart"); } };
$("drawer").onclick = (e) => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.inc) add(+t.dataset.inc, 1);
  else if (t.dataset.dec) add(+t.dataset.dec, -1);
  else if (t.dataset.act === "checkout") { view = "form"; renderDrawer(); }
  else if (t.dataset.act === "back") { view = "cart"; renderDrawer(); }
  else if (t.dataset.act === "submit") submit();
  else if (t.dataset.act === "close") closeDrawer();
  else if (t.dataset.act === "copy") {
    const done = () => (t.textContent = "คัดลอกแล้ว");
    try { navigator.clipboard.writeText(orderText(lastOrder)).then(done); } catch (x) { t.textContent = "คัดลอกไม่ได้ ลองส่งทาง LINE แทน"; }
  }
};

$("promo").textContent = `ซื้อครบ ${baht(CONFIG.freeOver)} ส่งฟรี ไม่ถึงคิดค่าส่ง ${baht(CONFIG.shipFee)}`;
renderChips(); renderGrid(); save();
</script>
</body>
</html>
